<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuehrungsmomente-Einmaleins</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--card:rgba(91,155,214,0.05);--card-h:rgba(91,155,214,0.10);
  --b1:#e3f0fc;--b2:#b4d7f5;--b3:#7cbde8;--b4:#4da3db;--b5:#3b8ec9;--b6:#2a6fa3;
  --g1:#e8edf3;--g2:#c0cad6;--g3:#8d9bab;--g4:#5e6f82;--g5:#3a4a5c;
  --acc:#38d9a9;--acc-d:rgba(56,217,169,0.15);
  --xp:#f0c040;--xp-d:rgba(240,192,64,0.12);
  --txt:#d0dae6;--txt-b:#f0f4f8;--txt-d:rgba(200,215,230,0.5);
  --r:18px;--f:'DM Sans',sans-serif;--fd:'Space Grotesk',sans-serif;
}
body{background:var(--bg);font-family:var(--f);color:var(--txt);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,#0b1220,#111d30 35%,#0e1828 70%,#0b1220)}
.bg-orb{position:absolute;border-radius:50%;pointer-events:none}
@keyframes floatOrb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-18px) scale(1.08)}100%{transform:translate(-18px,22px) scale(0.94)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(56,217,169,0.3)}50%{box-shadow:0 0 0 10px rgba(56,217,169,0)}}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes radarGrow{from{opacity:0;transform:scale(0.4)}to{opacity:1;transform:scale(1)}}
@keyframes shine{0%{left:-100%}100%{left:200%}}
@keyframes tickUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardReveal{from{opacity:0;transform:perspective(600px) rotateY(-12deg) scale(0.92)}to{opacity:1;transform:perspective(600px) rotateY(0) scale(1)}}
@keyframes traitPop{0%{opacity:0;transform:scale(0) rotate(-10deg)}60%{transform:scale(1.12) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

.app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid rgba(91,155,214,0.12);border-radius:var(--r);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);max-width:680px;width:100%;padding:44px 40px;animation:cardReveal 0.6s ease-out;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(91,155,214,0.3),transparent)}
.card::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(91,155,214,0.03),transparent);animation:shine 4s ease-in-out infinite;pointer-events:none}

.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(91,155,214,0.12);border:1px solid rgba(91,155,214,0.2);border-radius:100px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--b3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:20px}
.title{font-family:var(--fd);font-weight:700;font-size:32px;line-height:1.2;margin:0 0 6px;color:var(--txt-b)}
.subtitle{font-size:15px;color:var(--g3);margin:0 0 28px;line-height:1.65}
.body-text{font-size:15px;line-height:1.75;color:var(--txt);margin:0 0 24px}
.divider{height:1px;margin:24px 0;background:linear-gradient(90deg,transparent,rgba(91,155,214,0.15),transparent)}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.clock{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--b2);letter-spacing:1px}
.clock-label{font-size:11px;color:var(--g4);text-transform:uppercase;letter-spacing:.5px}
.xp-box{display:flex;align-items:center;gap:8px;background:var(--xp-d);border:1px solid rgba(240,192,64,0.2);border-radius:100px;padding:6px 16px;position:relative}
.xp-val{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--xp)}
.xp-label{font-size:11px;color:rgba(240,192,64,0.6)}
.xp-float{position:absolute;top:-8px;right:12px;font-family:var(--fd);font-weight:700;font-size:18px;color:var(--xp);animation:xpFloat 1.2s ease-out forwards;pointer-events:none}

/* Timeline */
.timeline{position:relative;height:6px;background:rgba(91,155,214,0.1);border-radius:3px;margin-bottom:28px}
.timeline-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--b5),var(--b3));transition:width .8s ease;position:relative}
.timeline-dot{position:absolute;right:-5px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--b3);border:3px solid var(--bg);box-shadow:0 0 12px rgba(91,155,214,0.4);animation:pulseGlow 2s infinite}
.tl-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--g4);font-weight:500;margin-bottom:12px}

/* Scenario */
.sc-header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sc-emoji{font-size:36px;animation:popIn .4s ease-out}
.sc-tag{font-size:12px;color:var(--b3);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.sc-title{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--txt-b);margin:0 0 16px}
.sc-text{font-size:15px;line-height:1.75;color:var(--txt);margin:0 0 24px;padding:16px 20px;background:rgba(91,155,214,0.04);border-radius:14px;border-left:3px solid rgba(91,155,214,0.25)}

/* Options */
.option{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:rgba(91,155,214,0.04);border:1px solid rgba(91,155,214,0.12);border-radius:16px;padding:18px 20px;margin-bottom:10px;font-size:15px;line-height:1.6;color:var(--txt);cursor:pointer;transition:all .3s ease;font-family:var(--f)}
.option:hover:not(.disabled){background:var(--card-h);border-color:rgba(91,155,214,0.3);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.25)}
.opt-key{flex-shrink:0;width:32px;height:32px;border-radius:10px;background:rgba(91,155,214,0.1);border:1px solid rgba(91,155,214,0.2);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:13px;color:var(--b3);transition:all .3s}
.option:hover:not(.disabled) .opt-key{background:rgba(91,155,214,0.2);border-color:var(--b4)}
.option.chosen{background:rgba(56,217,169,0.08);border-color:rgba(56,217,169,0.3);cursor:default}
.option.chosen .opt-key{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.option.not-chosen{opacity:.25;cursor:default}
.option.disabled{cursor:default}

/* Result */
.result{background:rgba(91,155,214,0.04);border:1px solid rgba(91,155,214,0.1);border-radius:16px;padding:22px;margin-top:18px;animation:fadeUp .45s ease-out}
.result-text{font-size:14px;line-height:1.7;color:var(--txt);margin:0 0 14px}
.trait-reveal{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--acc-d);border:1px solid rgba(56,217,169,0.2);border-radius:12px;animation:traitPop .5s ease-out .2s both}
.trait-name{font-size:14px;color:var(--txt-b);font-weight:600;margin-top:2px}
.trait-label{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:.8px;font-weight:600}

.next-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--b4),var(--b5));color:#fff;border:none;border-radius:100px;padding:13px 28px;font-size:14px;font-weight:700;font-family:var(--f);cursor:pointer;transition:all .3s;margin-top:16px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,142,201,0.3)}
.start-btn{font-size:16px;padding:16px 36px;background:linear-gradient(135deg,var(--b3),var(--b5))}
.outline-btn{background:transparent;border:1.5px solid rgba(91,155,214,0.3);color:var(--b3)}
.outline-btn:hover{background:rgba(91,155,214,0.08);border-color:var(--b3)}

/* Profile select */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.profile-card{background:rgba(91,155,214,0.04);border:1px solid rgba(91,155,214,0.12);border-radius:18px;padding:28px 22px;text-align:center;cursor:pointer;transition:all .35s ease;position:relative;overflow:hidden}
.profile-card:hover{background:var(--card-h);border-color:rgba(91,155,214,0.35);transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.3)}
.profile-card .pc-icon{font-size:44px;display:block;margin-bottom:14px}
.profile-card .pc-title{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--txt-b);margin-bottom:8px}
.profile-card .pc-desc{font-size:13px;line-height:1.55;color:var(--g3)}
.profile-card .pc-tag{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.profile-card.new-p .pc-tag{background:rgba(91,155,214,0.12);color:var(--b3);border:1px solid rgba(91,155,214,0.2)}
.profile-card.exp-p .pc-tag{background:var(--acc-d);color:var(--acc);border:1px solid rgba(56,217,169,0.2)}

/* Compass / Radar */
.compass{text-align:center;margin-top:28px}
.type-box{margin:24px auto;padding:20px 28px;background:rgba(56,217,169,0.06);border:1px solid rgba(56,217,169,0.15);border-radius:16px;text-align:center;animation:fadeUp .6s ease-out .5s both}
.type-label{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:6px}
.type-name{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--txt-b)}
.type-desc{font-size:14px;color:var(--g3);margin-top:8px;line-height:1.6}

.insight{background:rgba(91,155,214,0.04);border:1px solid rgba(91,155,214,0.1);border-radius:14px;padding:18px;margin-top:14px;text-align:left}
.insight h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--b3);margin:0 0 8px;font-weight:600}
.insight p{font-size:14px;line-height:1.6;color:var(--g3);margin:0}
.reflection{font-style:italic;font-size:15px;line-height:1.7;color:var(--g3);padding:12px 0 0;margin:0}

.kurs-box{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-radius:14px;background:rgba(91,155,214,0.04);border:1px solid rgba(91,155,214,0.1);margin-bottom:24px}
.kurs-box .kb-text{font-size:13px;line-height:1.65;color:var(--g3)}
.kurs-box strong{color:var(--b2)}

.day-preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 28px}
.day-slot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:rgba(91,155,214,0.04);border:1px solid rgba(91,155,214,0.08);font-size:13px;color:var(--g3)}
.day-slot .ds-time{font-family:var(--fd);font-weight:700;color:var(--b3);font-size:12px;min-width:42px}

.traits-collected{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tc{padding:6px 12px;border-radius:100px;font-size:12px;font-weight:600;background:var(--acc-d);border:1px solid rgba(56,217,169,0.2);color:var(--acc);animation:tickUp .3s ease-out}

@media(max-width:520px){
  .card{padding:28px 18px}
  .title{font-size:26px}
  .sc-title{font-size:19px}
  .clock{font-size:22px}
  .day-preview,.profile-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="bg" id="bgLayer"></div>
<div class="app" id="app"></div>

<script>
// ══════════════════════════════════════════════════════
// DIMENSIONS & TYPES

var DIMS={empathie:"Empathie",entscheidung:"Entscheidungskraft",kommunikation:"Kommunikation",struktur:"Struktur",mut:"Mut",reflexion:"Reflexion"};

  {name:"Empathische/r Teambuilder/in",desc:"Du f\u00fchrst \u00fcber Beziehung und Vertrauen. Menschen sp\u00fcren, dass du sie siehst. Achte darauf, auch dann klar zu sein, wenn es unbequem wird.",primary:"empathie"},
  {name:"Klare/r Entscheider/in",desc:"Du triffst Entscheidungen schnell und gibst Orientierung. Dein Team wei\u00df, woran es ist. Vergiss nicht, auch zuzuh\u00f6ren, bevor du handelst.",primary:"entscheidung"},
  {name:"Strategische/r Gestalter/in",desc:"Du denkst in Strukturen und Systemen. Ordnung gibt dir Sicherheit. Lass Raum f\u00fcr das Ungeplante \u2013 dort liegen oft die besten Ideen.",primary:"struktur"},

  {name:"Reflektierte/r Navigator/in",desc:"Du denkst nach, bevor du handelst. Deine Entscheidungen sind durchdacht. Manchmal braucht F\u00fchrung aber auch den mutigen Sprung.",primary:"reflexion"},
];

// ══════════════════════════════════════════════════════
// SCENARIOS \u2013 NEW LEADERS
// ══════════════════════════════════════════════════════
var SC_NEW=[
  {

    text:"Dein allererster Morgen als Teamleitung. Du kommst ins B\u00fcro \u2013 und ein Teammitglied steht bereits vor deiner T\u00fcr. Es wirkt nerv\u00f6s und m\u00f6chte dringend etwas besprechen. Dein Kalender ist leer, aber du bist selbst noch nicht angekommen.",
    options:[
      {text:"Du bittest die Person herein und h\u00f6rst zu \u2013 der Mensch geht vor.",consequence:"Die Person f\u00fchlt sich ernst genommen. Du startest nah am Team.",trait:"Menschenn\u00e4he",dims:{empathie:3,kommunikation:2,struktur:0,mut:1,entscheidung:0,reflexion:1}},
      {text:"Du bittest um 15 Minuten, um anzukommen \u2013 und kommst dann vorbereitet ins Gespr\u00e4ch.",consequence:"Du setzt fr\u00fch einen klaren Rahmen. Das Gespr\u00e4ch danach ist fokussierter.",trait:"Selbststeuerung",dims:{empathie:1,kommunikation:1,struktur:3,mut:0,entscheidung:1,reflexion:2}},

  },
  {

    text:"Im Chat poppt eine Nachricht auf: \u203AKann ich dich kurz anrufen? Ist wirklich dringend.\u2039 Gleichzeitig beginnt in 15 Minuten dein Antrittsmeeting \u2013 und du hast die Agenda noch nicht fertig.",

      {text:"Du rufst sofort zur\u00fcck \u2013 wenn jemand dringend sagt, nimmst du das ernst.",consequence:"Du reagierst schnell. Aber das Meeting startet ohne klare Agenda.",trait:"Reaktionsst\u00e4rke",dims:{empathie:3,kommunikation:2,struktur:0,mut:1,entscheidung:1,reflexion:0}},

  },
  {

    options:[
      {text:"Du legst offen dar, welche Werte dir wichtig sind und was du vom Team erwartest.",consequence:"Klare Ansage. Das Team wei\u00df, woran es ist. Manche finden das erfrischend \u2013 andere sind noch zur\u00fcckhaltend.",trait:"Klarheit",dims:{empathie:0,kommunikation:2,struktur:2,mut:3,entscheidung:2,reflexion:0}},
      {text:"Du fragst das Team: Was l\u00e4uft gut? Was w\u00fcnscht ihr euch von mir? Du h\u00f6rst erst mal zu.",consequence:"Das Team f\u00fchlt sich einbezogen. Du sammelst wertvolle Informationen, bevor du Entscheidungen triffst.",trait:"Zuh\u00f6rkultur",dims:{empathie:3,kommunikation:2,struktur:0,mut:1,entscheidung:0,reflexion:3}},
    ]
  },
  {
    time:"09:50",icon:"\uD83D\uDD25",tag:"Die Ger\u00fcchtek\u00fcche",title:"Zwischen den Zeilen",
    text:"Nach dem Meeting kommt jemand zu dir und erz\u00e4hlt leise: Zwei Kolleg:innen reden seit Wochen nicht mehr miteinander. Es belaste das ganze Klima. Die Person bittet dich, etwas zu tun \u2013 aber bitte diskret.",
    options:[
      {text:"Du bedankst dich f\u00fcr die Offenheit und k\u00fcndigst an, das Thema behutsam aufzugreifen.",consequence:"Du zeigst Mut, dich einem unangenehmen Thema zu stellen \u2013 ohne \u00fcber K\u00f6pfe hinweg zu handeln.",trait:"Konfliktkompetenz",dims:{empathie:2,kommunikation:2,struktur:1,mut:3,entscheidung:1,reflexion:1}},
      {text:"Du h\u00f6rst aufmerksam zu, m\u00f6chtest dir aber erst selbst ein Bild machen, bevor du eingreifst.",consequence:"Du vermeidest vorschnelles Handeln auf Basis einer einzelnen Perspektive. Beobachtung vor Intervention.",trait:"Beobachtungsst\u00e4rke",dims:{empathie:1,kommunikation:1,struktur:2,mut:1,entscheidung:1,reflexion:3}},
    ]
  },
  {
    time:"10:30",icon:"\uD83D\uDCE7",tag:"Post von oben",title:"Die unm\u00f6gliche Deadline",

      {text:"Du antwortest ehrlich: F\u00fcr eine fundierte Einsch\u00e4tzung brauchst du mehr Zeit \u2013 und bietest einen Alternativtermin an.",consequence:"Du setzt eine professionelle Grenze. Dein Chef wei\u00df jetzt: Du lieferst lieber sp\u00e4ter als oberfl\u00e4chlich.",trait:"Haltung zeigen",dims:{empathie:0,kommunikation:2,struktur:2,mut:3,entscheidung:2,reflexion:1}},
      {text:"Du fragst schnell im Team nach ersten Eindr\u00fccken und lieferst eine vorl\u00e4ufige Einsch\u00e4tzung.",consequence:"Du lieferst schnell \u2013 allerdings auf d\u00fcnner Basis. Dein Chef hat seine Antwort, aber du gehst ein Risiko ein.",trait:"Handlungsgeschwindigkeit",dims:{empathie:1,kommunikation:1,struktur:0,mut:1,entscheidung:3,reflexion:0}},
    ]
  },
  {
    time:"11:15",icon:"\uD83E\uDD14",tag:"Die stille Person",title:"Wer nicht spricht, f\u00e4llt auf",
    text:"Dir ist aufgefallen: Eine Person hat im Meeting kein einziges Wort gesagt. Jetzt sitzt sie allein am Platz, Kopfh\u00f6rer auf, Blick auf den Bildschirm. Vielleicht introvertiert. Vielleicht ist etwas anderes los.",
    options:[
      {text:"Du gehst kurz vorbei und fragst beil\u00e4ufig, wie es ihr geht \u2013 ohne Druck, ohne gro\u00dfes Gespr\u00e4ch.",consequence:"Eine kleine Geste mit gro\u00dfer Wirkung. Du zeigst: Ich sehe dich, auch wenn du leise bist.",trait:"Aufmerksamkeit",dims:{empathie:3,kommunikation:2,struktur:0,mut:1,entscheidung:0,reflexion:2}},
      {text:"Du notierst es dir und beobachtest in den n\u00e4chsten Tagen, ob sich ein Muster zeigt.",consequence:"Du handelst nicht vorschnell. Manche Menschen brauchen Zeit \u2013 besonders bei neuer F\u00fchrung.",trait:"Geduld",dims:{empathie:1,kommunikation:0,struktur:2,mut:0,entscheidung:1,reflexion:3}},
    ]
  },
  {
    time:"12:00",icon:"\uD83C\uDF5D",tag:"Mittagspause",title:"Essen mit dem Team?",
    text:"Dein Team geht gemeinsam zum Mittagessen. Du wirst eingeladen. Es ist deine einzige Pause heute \u2013 und du sp\u00fcrst, dass dir der Kopf raucht. Gleichzeitig w\u00e4re es eine Chance, das Team pers\u00f6nlicher kennenzulernen.",

  s+='<path d="'+pd+'" fill="url(#rf)" stroke="rgba(91,155,214,0.8)" stroke-width="2.5" filter="url(#gl)" style="animation:radarGrow .8s ease-out .3s both"/>';
  keys.forEach(function(k,i){var v=Math.max((scores[k]||0)/mx,0.08);var p=pt(i,v);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="var(--b3)" stroke="#fff" stroke-width="2" style="animation:popIn .4s ease-out '+(0.5+i*0.1)+'s both"/>'});
  keys.forEach(function(k,i){var lp=pt(i,1.22);s+='<text x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" style="font-size:11px;fill:rgba(200,215,230,0.7);font-family:DM Sans,sans-serif;font-weight:500">'+DIMS[k]+'</text>'});
  return s+'</svg>';
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render(){
  var app=document.getElementById("app");

  // ─── INTRO ───
  if(S.phase==="intro"){
    app.innerHTML=
      '<div class="card" style="max-width:620px">'+
        '<div class="badge">\uD83C\uDFAE F\u00fchrungskr\u00e4fte-Einmaleins</div>'+
        '<h1 class="title">F\u00fchrungsmoment</h1>'+
        '<p class="subtitle">Ein interaktives Planspiel \u2013 erlebe einen Tag als F\u00fchrungskraft und entdecke deinen pers\u00f6nlichen F\u00fchrungsstil.</p>'+
        '<div class="kurs-box"><div style="font-size:24px;flex-shrink:0;margin-top:2px">\uD83C\uDFAC</div><div class="kb-text">Dieses Spiel ist der <strong>Abschluss der Videoreihe</strong>. Du hast bereits sieben zentrale F\u00fchrungssituationen kennengelernt. Jetzt testest du: Wie w\u00fcrdest du selbst entscheiden?</div></div>'+
        '<div class="divider"></div>'+
        '<p class="body-text" style="text-align:center;color:var(--b2);font-weight:500">W\u00e4hle dein Profil:</p>'+
        '<div class="profile-grid">'+
          '<div class="profile-card new-p" onclick="selectProfile(\'new\')">'+
            '<span class="pc-icon">\uD83C\uDF31</span>'+
            '<div class="pc-title">Ich bin neu in der F\u00fchrung</div>'+
            '<div class="pc-desc">Erste F\u00fchrungsrolle oder kurz davor. Du willst herausfinden, wie du als F\u00fchrungskraft tickst.</div>'+
            '<span class="pc-tag">Dein erster Tag</span>'+
          '</div>'+
          '<div class="profile-card exp-p" onclick="selectProfile(\'exp\')">'+
            '<span class="pc-icon">\uD83C\uDFC6</span>'+
            '<div class="pc-title">Ich f\u00fchre schon l\u00e4nger</div>'+
            '<div class="pc-desc">Du hast Erfahrung. Jetzt willst du deine Muster erkennen und deinen Stil bewusst hinterfragen.</div>'+
            '<span class="pc-tag">Ein Tag wie jeder \u2013 oder?</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    return;
  }

  // ─── PRE-GAME (after profile select, before first scenario) ───
  if(S.phase==="pregame"){
    var cfg=PROFILE_CFG[S.profile];
    var preview=cfg.scenarios.map(function(sc){return'<div class="day-slot"><span class="ds-time">'+sc.time+'</span><span style="font-size:16px">'+sc.icon+'</span>'+sc.tag+'</div>'}).join("");
    app.innerHTML=
      '<div class="card">'+
        '<div class="badge">'+cfg.badge+'</div>'+
        '<h1 class="title">'+cfg.title+'</h1>'+
        '<p class="subtitle">'+cfg.subtitle+'</p>'+
        '<div class="kurs-box"><div style="font-size:24px;flex-shrink:0;margin-top:2px">\uD83D\uDCA1</div><div class="kb-text">'+cfg.kursText+'</div></div>'+
        '<div class="divider"></div>'+
        '<p class="body-text" style="font-size:13px;color:var(--g4)">Dein Tag von 08:00 bis 16:45 \u2013 in jeder Situation entscheidest du:</p>'+
        '<div class="day-preview">'+preview+'</div>'+
        '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="next-btn start-btn" onclick="startGame()">Tag starten \u2192</button><button class="next-btn outline-btn" onclick="up({phase:\'intro\',profile:null})" style="margin-top:16px">\u2190 Zur\u00fcck</button></div>'+
      '</div>';
    return;
  }

  // ─── GAME ───
  if(S.phase==="game"){
    var cfg=PROFILE_CFG[S.profile];
    var scs=cfg.scenarios;
    var sc=scs[S.si];
    var progress=((S.si+(S.showResult?1:0))/scs.length)*100;

    var hudHtml='<div class="hud"><div style="display:flex;align-items:center;gap:16px"><div><div class="clock">'+sc.time+'</div><div class="clock-label">Uhr</div></div></div><div class="xp-box"><span style="font-size:16px">\u2B50</span><span class="xp-val" id="xpVal">'+S.xp+'</span><span class="xp-label">XP</span>'+(S.xpFloat?'<span class="xp-float">+10</span>':'')+'</div></div>';
    var tlHtml='<div class="timeline"><div class="timeline-fill" style="width:'+progress+'%"><div class="timeline-dot"></div></div></div><div class="tl-labels"><span>08:00</span><span>16:45</span></div>';
    var traitsHtml=S.traits.length?'<div class="traits-collected">'+S.traits.map(function(t){return'<span class="tc">\u2713 '+t+'</span>'}).join("")+'</div>':'';
    var optsHtml=sc.options.map(function(opt,oi){var cls="option";if(S.chosen!==null){cls+=" disabled";if(S.chosen===oi)cls+=" chosen";else cls+=" not-chosen"}return'<button class="'+cls+'" '+(S.chosen!==null?'disabled':'')+' onclick="choose('+oi+')"><span class="opt-key">'+(oi===0?'A':'B')+'</span><span>'+opt.text+'</span></button>'}).join("");

    var resHtml='';
    if(S.showResult){
      var opt=sc.options[S.chosen];
      var isLast=S.si>=scs.length-1;
      resHtml='<div class="result"><p class="result-text">'+opt.consequence+'</p><div class="trait-reveal"><span style="font-size:20px">\uD83D\uDD13</span><div class="trait-info"><div class="trait-label">Eigenschaft entdeckt</div><div class="trait-name">'+opt.trait+'</div></div></div><div style="text-align:right"><button class="next-btn" onclick="nextScenario()">'+(isLast?'Ergebnis ansehen \u2192':'Weiter \u2192')+'</button></div></div>';
    }

    app.innerHTML='<div class="card">'+hudHtml+tlHtml+traitsHtml+'<div class="sc-header"><span class="sc-emoji">'+sc.icon+'</span><span class="sc-tag">'+sc.tag+'</span></div><h2 class="sc-title">'+sc.title+'</h2><div class="sc-text">'+sc.text+'</div>'+optsHtml+resHtml+'</div>';
    return;
  }

  // ─── RESULT ───
  if(S.phase==="result"){
    var cfg=PROFILE_CFG[S.profile];
    var scores=S.scores;
    var maxDim=Object.keys(DIMS).reduce(function(a,b){return scores[a]>scores[b]?a:b});
    var myType=TYPES.find(function(t){return t.primary===maxDim})||TYPES[0];
    var sorted=Object.keys(DIMS).map(function(k){return{key:k,val:scores[k]}}).sort(function(a,b){return b.val-a.val});
    var topTwo=sorted.slice(0,2).map(function(d){return DIMS[d.key]});
    var lowTwo=sorted.slice(-2).map(function(d){return DIMS[d.key]});
    var traitsHtml='<div class="traits-collected" style="justify-content:center;margin:16px 0 0">'+S.traits.map(function(t){return'<span class="tc">\u2713 '+t+'</span>'}).join("")+'</div>';
    var reflHtml=cfg.reflections.map(function(r){return'<p class="reflection">'+r+'</p>'}).join("");

    app.innerHTML=
      '<div class="card" style="max-width:720px;text-align:center">'+
        '<div class="badge">\uD83C\uDFC6 Dein Ergebnis</div>'+
        '<h1 class="title">'+cfg.resultTitle+'</h1>'+
        '<p class="subtitle">'+cfg.resultSubtitle+'</p>'+
        '<div style="display:flex;justify-content:center;margin-bottom:8px"><div class="xp-box"><span style="font-size:16px">\u2B50</span><span class="xp-val">'+S.xp+'</span><span class="xp-label">XP gesammelt</span></div></div>'+
        traitsHtml+
        '<div class="compass">'+radarSVG(scores)+'</div>'+
        '<div class="type-box"><div class="type-label">Dein F\u00fchrungstyp</div><div class="type-name">'+myType.name+'</div><div class="type-desc">'+myType.desc+'</div></div>'+
        '<div style="text-align:left">'+
          '<div class="insight"><h4>\u2726 Deine St\u00e4rken</h4><p>Besonders ausgepr\u00e4gt bei dir: <strong style="color:var(--b2)">'+topTwo.join(" &amp; ")+'</strong>. Diese Dimensionen waren in deinen Entscheidungen am pr\u00e4sentesten.</p></div>'+
          '<div class="insight"><h4>\u2192 Entwicklungspotenzial</h4><p>Weniger stark vertreten: <strong style="color:var(--acc)">'+lowTwo.join(" &amp; ")+'</strong>. Das k\u00f6nnten Themen f\u00fcr den Workshop sein.</p></div>'+
          '<div class="divider"></div>'+
          '<div class="insight"><h4>\uD83D\uDCAC Reflexionsfragen f\u00fcr den Workshop</h4>'+reflHtml+'</div>'+
          '<div class="kurs-box" style="margin-top:20px;margin-bottom:0"><div style="font-size:24px;flex-shrink:0;margin-top:2px">\uD83D\uDE80</div><div class="kb-text">'+cfg.workshopText+'</div></div>'+
          '<div style="text-align:center;margin-top:24px"><button class="next-btn outline-btn" onclick="resetAll()">\u21BB Nochmal spielen</button></div>'+
        '</div>'+
      '</div>';
    return;
  }
}

// ══════════════════════════════════════════════════════
// HANDLERS
// ══════════════════════════════════════════════════════
function selectProfile(p){up({phase:"pregame",profile:p})}
function startGame(){up({phase:"game",si:0,chosen:null,showResult:false,scores:{empathie:0,entscheidung:0,kommunikation:0,struktur:0,mut:0,reflexion:0},xp:0,xpFloat:false,traits:[]})}
function choose(idx){
  var scs=PROFILE_CFG[S.profile].scenarios;
  var opt=scs[S.si].options[idx];
  var ns={};Object.keys(S.scores).forEach(function(k){ns[k]=S.scores[k]+(opt.dims[k]||0)});
  var nt=S.traits.slice();nt.push(opt.trait);
  up({chosen:idx,showResult:true,scores:ns,xp:S.xp+10,xpFloat:true,traits:nt});
  setTimeout(function(){S.xpFloat=false},1300);
}
function nextScenario(){
  var scs=PROFILE_CFG[S.profile].scenarios;
  if(S.si>=scs.length-1)up({phase:"result"});
  else up({si:S.si+1,chosen:null,showResult:false,xpFloat:false});
}
function resetAll(){up({phase:"intro",profile:null,si:0,chosen:null,showResult:false,scores:{empathie:0,entscheidung:0,kommunikation:0,struktur:0,mut:0,reflexion:0},xp:0,xpFloat:false,traits:[]})}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
initBg();
render();
</script>
</body>
</html>
